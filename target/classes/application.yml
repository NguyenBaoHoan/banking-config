server:
  port: ${PORT:8888}

spring:
  application:
    name: config-service
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/your-github-user/banking-auth-config.git}
          default-label: ${CONFIG_GIT_LABEL:main}
          clone-on-start: true
          force-pull: true
          timeout: 10
          search-paths: ${CONFIG_GIT_SEARCH_PATHS:}
          username: ${CONFIG_GIT_USERNAME:}
          password: ${CONFIG_GIT_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
